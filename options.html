<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>译读设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header><img class="mark" src="icons/icon-48.png" alt="" width="36" height="36"><div><h1>译读设置</h1><p>密钥仅保存在当前浏览器中。</p></div></header>
    <form id="settingsForm" aria-busy="true">
      <fieldset disabled>
        <label for="apiKey">DeepSeek API Key</label>
        <input id="apiKey" name="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" required>
        <label for="model">模型</label>
        <input id="model" name="model" type="text" autocomplete="off" spellcheck="false" value="deepseek-flash" required>
        <p id="modelHint" class="hint">当前默认 deepseek-flash（DeepSeek-V4.1-Flash），也可填 deepseek-v4-pro。</p>
        <label for="apiUrl">API 地址</label>
        <input id="apiUrl" name="apiUrl" type="text" autocomplete="off" spellcheck="false" placeholder="https://api.deepseek.com">
        <p class="hint">默认为 https://api.deepseek.com；使用中转或代理时填写其 OpenAI 兼容地址（不需要 /chat/completions 后缀）。</p>
        <button type="submit">保存设置</button>
      </fieldset>
      <p id="status" aria-live="polite"></p>
    </form>
    <section class="cache">
      <h2>本地缓存</h2>
      <p>译文和导读缓存在当前浏览器中：按文章网址保存，正文、格式、模型或固定译法变化时自动失效；最多保留 20 篇文章、30 天。想让某篇文章重新翻译，清除缓存后重新打开即可。</p>
      <button id="clearCache" type="button">清除全部缓存</button>
      <p id="cacheStatus" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
