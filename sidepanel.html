<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>译读</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="yidu-header">
    <div class="yidu-brand"><img class="yidu-mark" src="icons/icon-32.png" alt="" width="32" height="32"><span>译读</span></div>
    <button id="settings" class="yidu-settings" type="button" aria-label="打开译读设置">设置</button>
  </header>
  <nav class="yidu-controls" role="tablist" aria-label="译读内容">
    <button id="tab-translation" class="yidu-tab" type="button" role="tab" aria-selected="true" aria-controls="view-translation">中文翻译</button>
    <button id="tab-summary" class="yidu-tab" type="button" role="tab" aria-selected="false" aria-controls="view-summary" tabindex="-1">导读</button>
    <button id="tab-glossary" class="yidu-tab" type="button" role="tab" aria-selected="false" aria-controls="view-glossary" tabindex="-1">固定译法库</button>
  </nav>
  <section id="view-translation" class="yidu-view" role="tabpanel" aria-labelledby="tab-translation">
    <div id="status" class="yidu-status" role="status" aria-live="polite">正在读取文章…</div>
    <main id="content" class="yidu-content" aria-busy="true"></main>
  </section>
  <section id="view-summary" class="yidu-view" role="tabpanel" aria-labelledby="tab-summary" hidden>
    <div id="summary-content" class="yidu-content yidu-summary-content"></div>
  </section>
  <section id="view-glossary" class="yidu-view" role="tabpanel" aria-labelledby="tab-glossary" hidden>
    <div class="yidu-content yidu-glossary-content">
      <h1>固定译法库</h1>
      <p class="yidu-view-intro">你保存的译法会在翻译相关文章时优先使用。</p>
      <form id="glossary-form" class="yidu-glossary-form">
        <label for="glossary-source">英文词语</label>
        <input id="glossary-source" name="source" type="text" autocomplete="off" spellcheck="false" maxlength="80" required>
        <label for="glossary-target">固定译法</label>
        <input id="glossary-target" name="target" type="text" autocomplete="off" maxlength="80" required>
        <div class="yidu-form-actions">
          <button class="yidu-action" type="submit">保存译法</button>
          <button id="glossary-cancel" class="yidu-action secondary" type="button" hidden>取消编辑</button>
        </div>
      </form>
      <p id="glossary-status" class="yidu-glossary-status" role="status" aria-live="polite"></p>
      <div id="glossary-list" class="yidu-glossary-list"></div>
    </div>
  </section>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
