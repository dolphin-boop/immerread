<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: linear-gradient(120deg, #fdeeea 0%, #f9ecf2 38%, #ecebfb 72%, #e3e9fb 100%);
    color: #2b2118;
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 48px 56px;
    position: relative;
    overflow: hidden;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow.a { width: 460px; height: 460px; background: #f6cfc4; top: -160px; left: 240px; opacity: .55; }
  .glow.b { width: 460px; height: 460px; background: #c3c8f2; bottom: -220px; right: -100px; opacity: .55; }

  .left { width: 470px; flex: none; position: relative; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 10px 28px rgba(169,79,50,.28); }
  .brand h1 { font-size: 56px; letter-spacing: 3px; color: #a94f32; font-weight: 800; line-height: 1.05; }
  .brand .en { font-size: 26px; font-weight: 700; color: #6b5d4f; letter-spacing: 1.5px; margin-top: 6px; }
  .tagline { margin-top: 26px; font-size: 25px; font-weight: 700; line-height: 1.5; }
  .tagline small { display: block; margin-top: 8px; font-size: 15px; font-weight: 500; color: #7d6f60; }

  .features { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .feat {
    background: rgba(255,255,255,.78);
    border: 1px solid #e5d6c2;
    border-radius: 14px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .feat .chip {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .chip svg { width: 21px; height: 21px; }
  .feat b { display: block; font-size: 16.5px; color: #3c2f24; }
  .feat span { display: block; font-size: 12.5px; color: #8a7a68; margin-top: 3px; }

  .right { position: relative; flex: 1; }
  .browser {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(90,58,38,.28);
    border: 1px solid #e0d0bc;
    background: #fff;
  }
  .bar {
    height: 40px;
    background: linear-gradient(#f4ece1, #ece1d2);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    border-bottom: 1px solid #e0d0bc;
  }
  .bar i { width: 12px; height: 12px; border-radius: 50%; }
  .bar i:nth-child(1) { background: #ec6a5e; }
  .bar i:nth-child(2) { background: #f4bf4f; }
  .bar i:nth-child(3) { background: #61c454; }
  .bar .url {
    margin-left: 10px;
    flex: 1;
    background: rgba(255,255,255,.75);
    border-radius: 8px;
    font-size: 13px;
    color: #8a7a68;
    padding: 5px 12px;
  }
  .browser img { display: block; width: 100%; height: 452px; object-fit: cover; object-position: top left; }
  .note {
    position: absolute;
    right: 6px;
    bottom: -34px;
    font-size: 15px;
    color: #a94f32;
    font-weight: 600;
    transform: rotate(-2deg);
  }
  .spark { position: absolute; border-radius: 6px; }
  .spark.s1 { width: 34px; height: 9px; background: #e2607a; top: 96px; left: 418px; transform: rotate(52deg); }
  .spark.s2 { width: 44px; height: 9px; background: #d1662f; top: 138px; left: 446px; transform: rotate(52deg); }
  .spark.s3 { width: 30px; height: 8px; background: #7a86e8; top: 42px; right: 96px; transform: rotate(52deg); }
  .spark.s4 { width: 38px; height: 8px; background: #9aa3f0; top: 62px; right: 62px; transform: rotate(52deg); }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="spark s1"></div>
  <div class="spark s2"></div>
  <div class="spark s3"></div>
  <div class="spark s4"></div>

  <div class="left">
    <div class="brand">
      <img src="../icons/icon-128.png" alt="译读图标">
      <div>
        <h1>译读</h1>
        <div class="en">ImmerRead</div>
      </div>
    </div>
    <div class="tagline">
      沉浸式阅读英文文章<br>中文、英文各自完整，互不打扰
      <small>Read English articles immersively, in whole Chinese or whole English.</small>
    </div>
    <div class="features">
      <div class="feat">
        <span class="chip" style="background:#fbe3d8">
          <svg viewBox="0 0 24 24" fill="none" stroke="#a94f32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9M8.5 3v2c0 3-2 5.5-4.5 7M6 9c1.5 2 3.5 3.7 6 4.5"/><path d="M12.5 21l4.5-10 4.5 10M14.3 17h5.4"/></svg>
        </span>
        <div><b>LLM 整篇翻译</b><span>流畅中文译文</span></div>
      </div>
      <div class="feat">
        <span class="chip" style="background:#e0ecdd">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4c7a43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 8h7M9 12h5"/></svg>
        </span>
        <div><b>自定义术语库</b><span>译法跨文章复用</span></div>
      </div>
      <div class="feat">
        <span class="chip" style="background:#e2e6f6">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4a5aa8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </span>
        <div><b>导读 · 划线解释</b><span>LLM 助学功能</span></div>
      </div>
      <div class="feat">
        <span class="chip" style="background:#f6ecd4">
          <svg viewBox="0 0 24 24" fill="none" stroke="#a07c1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        </span>
        <div><b>渐进翻译 · 本地缓存</b><span>节省 token</span></div>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="browser">
      <div class="bar"><i></i><i></i><i></i><span class="url">https://www.anthropic.com/engineering/long-running-agents</span></div>
      <img src="../demo/article-translator/20260917-155819.jpg" alt="译读实际使用界面">
    </div>
    <div class="note">← 实际使用界面：原文在左，译文在右</div>
  </div>
</body>
</html>
